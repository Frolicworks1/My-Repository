plugins {
    id 'com.android.application'
}

android {
    namespace 'com.frolicworks.pstoucharm64'
    compileSdk 36

    defaultConfig {
        applicationId 'com.frolicworks.pstoucharm64'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '0.1.0-prototype'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
