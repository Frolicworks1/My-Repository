name: Static tooling checks

on:
  push:
    branches:
      - ps-touch-arm64-reverse-engineering
  pull_request:
    branches:
      - ps-touch-arm64-reverse-engineering
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Codespaces helper syntax
        run: bash -n scripts/codespaces_preflight.sh scripts/build_original_air_arm64_diagnostic.sh
      - name: Compile static analysis tools
        run: python -m py_compile tools/audit_apk.py tools/decode_axml.py tools/ane_compat_report.py tools/prepare_air_migration.py tools/arm64_build_gate.py tools/compare_apk_variants.py tools/audit_swf.py tools/prepare_original_air_workspace.py tests/test_prepare_original_air_workspace.py tests/test_compare_apk_variants.py tests/test_audit_swf.py tests/test_decode_axml.py tests/test_ane_compat_report.py tests/test_prepare_air_migration.py tests/test_arm64_build_gate.py
      - name: Test manifest decoder, ANE report, migration extractor, ARM64 gate, APK variant comparison and compiled SWF inventory and original AIR workspace preparation
        run: python -m unittest discover -s tests -v
      - name: Confirm private APK inputs are not committed
        run: |
          test -f tools/audit_apk.py
          test -f tools/decode_axml.py
          test -f tools/ane_compat_report.py
          test -f tools/prepare_air_migration.py
          test -f tools/arm64_build_gate.py
          test -f tools/compare_apk_variants.py
          test -f tools/audit_swf.py
          test -f tools/prepare_original_air_workspace.py
          test -f scripts/build_original_air_arm64_diagnostic.sh
          test -f scripts/codespaces_preflight.sh
          test -f docs/ANDROID16_BLOCKER_ANALYSIS.md
          test -f docs/INSTALL_FAILURE_TRIAGE.md
          test -f tests/test_decode_axml.py
          test -f tests/test_ane_compat_report.py
          test -f tests/test_prepare_air_migration.py
          test -f tests/test_arm64_build_gate.py
          test -f tests/test_compare_apk_variants.py
          test -f tests/test_audit_swf.py
          test -f tests/test_prepare_original_air_workspace.py
          if find . -type f -iname '*.apk' -not -path './.git/*' | grep -q .; then
            echo "Unexpected APK found in repository; proprietary input must stay out of Git."
            exit 1
          fi
